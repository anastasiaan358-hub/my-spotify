name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: на PR важен только
# последний коммит, а очередь устаревших прогонов занимает раннеры
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Отдельно от тестов: линтер не нуждается в базе и отвечает за секунды,
  # поэтому ошибку форматирования видно, не дожидаясь pytest
  lint:
    name: Линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      # --output-format=github подсвечивает замечания прямо в диффе PR
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myspotify
          POSTGRES_USER: myspotify
          POSTGRES_PASSWORD: myspotify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myspotify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgres://myspotify:myspotify@localhost:5432/myspotify
      ALLOWED_HOSTS: localhost
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      # Ловит разъезд моделей и миграций: без этого второй разработчик узнаёт
      # о пропущенной миграции только на своей машине
      - name: Миграции не отстали от моделей
        run: python manage.py makemigrations --check --dry-run
      - name: Тесты
        run: pytest
      # Дымовая проверка прод-настроек: dev и test их не импортируют, поэтому
      # сломанный prod.py иначе обнаружится только на деплое. Порог ERROR, а не
      # WARNING: под CI штатно предупреждает про короткий SECRET_KEY и
      # отсутствие SSL, плюс drf_spectacular про вьюхи без serializer_class
      - name: Прод-настройки загружаются
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
        run: python manage.py check --deploy --fail-level ERROR

  # Оверрайдов стало несколько, и они легко разъезжаются: config разворачивает
  # их и валидирует, не поднимая ни одного контейнера
  compose:
    name: Compose-файлы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить каждую комбинацию оверрайдов
        run: |
          set -eu
          # Каждую комбинацию разворачиваем со своим примером окружения: прод
          # требует переменных, которых нет в dev-примере. Файл обязан
          # называться .env — на него ссылается env_file в базовом файле
          check() {
            example="$1"; shift
            echo "::group::$*"
            cp "$example" .env
            docker compose "$@" config > /dev/null
            echo "::endgroup::"
          }
          check .env.example -f docker-compose.yml -f compose.dev.yml
          check .env.prod.example -f docker-compose.yml -f compose.prod.yml
          # Файлы общего стенда приезжают отдельным PR: проверяем их, когда они
          # уже есть, чтобы джоба не падала до его вливания
          if [ -f compose.lan.yml ]; then
            check .env.example -f docker-compose.yml -f compose.dev.yml -f compose.lan.yml
          fi
          if [ -f compose.shared.yml ]; then
            check .env.example -f compose.shared.yml
          fi
          rm -f .env
