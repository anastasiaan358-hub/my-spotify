# Dev-override: docker compose -f docker-compose.yml -f compose.dev.yml up
services:
  web:
    build:
      context: .
      target: dev
    image: my-spotify:dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

  celery:
    build:
      context: .
      target: dev
    image: my-spotify:dev
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

  celery-beat:
    build:
      context: .
      target: dev
    image: my-spotify:dev
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

  telegram-bot:
    build:
      context: .
      target: bot
    image: my-spotify-telegram-bot:dev
    volumes:
      - .:/app

  telegram-vk-catalog:
    build:
      context: .
      target: bot
    image: my-spotify-telegram-bot:dev
    volumes:
      - .:/app

  db:
    ports:
      - "5432:5432"
