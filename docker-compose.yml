services:
  web:
    build:
      context: .
      target: prod
    # Тег обязателен: dev- и prod-стадии иначе собираются в образ с одним именем
    # и затирают друг друга, из-за чего в «dev»-контейнере не оказывается ruff
    image: my-spotify:prod
    env_file: .env
    # Перебивает DJANGO_SETTINGS_MODULE из .env: прод-стек обязан подниматься на
    # прод-настройках, даже если в .env лежит dev-значение для локальной работы
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  celery:
    build:
      context: .
      target: prod
    image: my-spotify:prod
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config worker -l info -Q default
    depends_on:
      db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL, а не CMD: exec-форма запускается без шелла и $HOSTNAME
      # остался бы неразвёрнутой строкой, из-за чего проверка всегда падала
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery-beat:
    build:
      context: .
      target: prod
    image: my-spotify:prod
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config beat -l info
    depends_on:
      redis-queue:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myspotify
      POSTGRES_USER: myspotify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myspotify}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myspotify -d myspotify"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Кэш и счётчики троттлинга: терять безопасно (ARCHITECTURE.md §5.8)
  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Брокер Celery: вытеснять задачи нельзя, поэтому noeviction и отдельный инстанс
  redis-queue:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - queuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  queuedata:
